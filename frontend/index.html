<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) mean anything:
         without it iOS insets the web view to the safe area, every inset reads
         as 0, and the strip behind the status bar isn't the page's to paint —
         so a full-height drawer stopped short of it and the system's own colour
         showed through. With cover the page owns the whole screen, and the
         insets (top bar, sheet, toast, dialog, drawer) do the keeping-clear. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Match the iOS status-bar / dynamic-island area to the page backdrop -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Add to Home Screen (iOS + Android) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Input Pub" />
    <!-- black-translucent is the only value that hands the status-bar strip to
         the page. Under "default" iOS draws it itself and insets the web view,
         so the strip never followed the theme (it stayed light in dark mode)
         and picked up whatever the system happened to sample from the page —
         including the drawer's scrim, which then stuck until a reload. With
         this the page paints it like any other pixels; the safe-area insets
         added throughout keep content out from under it. Its text colour comes
         from theme-color, which lib/theme.ts keeps on the real theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Input Pub</title>
    <meta
      name="description"
      content="input here, publish anywhere — a minimalist Markdown editor that publishes to X, GitHub, Email, ChatGPT and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Input Pub" />
    <meta property="og:url" content="https://inputpub.com/" />
    <meta property="og:title" content="Input Pub" />
    <meta property="og:description" content="input here, publish anywhere" />
    <!-- Absolute URLs are required: X/WeChat/Slack scrapers don't resolve relative paths -->
    <meta property="og:image" content="https://inputpub.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Input Pub — input here, publish anywhere" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Input Pub" />
    <meta name="twitter:description" content="input here, publish anywhere" />
    <meta name="twitter:image" content="https://inputpub.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
